<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 针灸大师</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#080810;color:#e0e0e0;overflow:hidden;height:100vh}
#loading{position:fixed;inset:0;background:#080810;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;transition:opacity .8s}
#loading.hide{opacity:0;pointer-events:none}
#loading .ring{width:56px;height:56px;border:3px solid #1a1a2e;border-top-color:#a78bfa;border-radius:50%;animation:spin .8s linear infinite}
#loading p{margin-top:16px;color:#666;font-size:13px;letter-spacing:1px}
#loading .progress-bar{width:200px;height:3px;background:#1a1a2e;border-radius:2px;margin-top:10px;overflow:hidden}
#loading .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#a78bfa,#6dd5fa);transition:width .3s}
@keyframes spin{to{transform:rotate(360deg)}}
canvas{display:block}
#topbar{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;padding:0 16px;background:linear-gradient(180deg,rgba(8,8,16,.95),transparent);z-index:10;pointer-events:none}
#topbar h1{font-size:17px;font-weight:600;color:#fff;pointer-events:auto;letter-spacing:1px}
#topbar h1 span{background:linear-gradient(135deg,#a78bfa,#6dd5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.controls{margin-left:auto;display:flex;gap:6px;pointer-events:auto}
.controls button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#999;padding:5px 12px;border-radius:8px;font-size:12px;cursor:pointer;transition:all .2s}
.controls button:hover,.controls button.active{background:rgba(167,139,250,.15);border-color:#a78bfa;color:#fff}
#search-box{position:fixed;top:56px;left:16px;z-index:10;display:flex;gap:6px;align-items:center}
#search-input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#fff;padding:6px 12px;border-radius:8px;font-size:13px;width:200px;outline:none}
#search-input:focus{border-color:#a78bfa}
#search-results{position:fixed;top:86px;left:16px;background:rgba(15,15,22,.95);border:1px solid rgba(255,255,255,.08);border-radius:10px;max-height:300px;overflow-y:auto;z-index:15;display:none;min-width:260px;backdrop-filter:blur(12px)}
#search-results.show{display:block}
.sr-item{padding:8px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid rgba(255,255,255,.04);display:flex;align-items:center;gap:8px}
.sr-item:hover{background:rgba(167,139,250,.1)}
.sr-item .sr-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sr-item .sr-name{font-weight:500;color:#fff}
.sr-item .sr-code{color:#888;font-size:11px;margin-left:auto}
#mtabs{position:fixed;top:56px;left:230px;display:flex;gap:4px;z-index:10;flex-wrap:wrap;max-width:calc(100vw - 260px);padding:4px 0}
.mt{padding:4px 10px;border-radius:16px;font-size:11px;cursor:pointer;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.4);backdrop-filter:blur(6px);transition:all .2s;white-space:nowrap;color:#888}
.mt:hover{border-color:rgba(255,255,255,.2);color:#ccc}
.mt.active{color:#fff;border-color:var(--mc);background:color-mix(in srgb,var(--mc) 20%,transparent)}
/* Meridian tab info banner */
.mt-info-banner{position:fixed;top:90px;left:230px;background:rgba(15,15,22,.92);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:8px 14px;z-index:11;backdrop-filter:blur(12px);font-size:12px;display:none;max-width:350px}
.mt-info-banner.show{display:block}
.mt-info-banner .mib-name{color:#fff;font-weight:600;font-size:13px}
.mt-info-banner .mib-count{color:#888;margin-left:8px}
.mt-info-banner .mib-link{color:#a78bfa;cursor:pointer;margin-left:10px;text-decoration:underline}
/* Panel */
#panel{position:fixed;top:0;right:0;width:360px;height:100vh;background:rgba(12,12,20,.94);backdrop-filter:blur(20px);border-left:1px solid rgba(255,255,255,.05);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:20;overflow-y:auto;padding:20px}
#panel.open{transform:translateX(0)}
#panel::-webkit-scrollbar{width:3px}
#panel::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
.close-btn{position:absolute;top:12px;right:12px;background:none;border:none;color:#666;font-size:20px;cursor:pointer;padding:4px 8px}
.close-btn:hover{color:#fff}
.pn{font-size:22px;font-weight:700;margin-bottom:2px}
.pp{font-size:13px;color:#888}
.pm{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;margin-top:6px}
.ps{margin-top:16px}
.ps h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#555;margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid rgba(255,255,255,.05)}
.ps p,.ps li{font-size:13px;line-height:1.8;color:#bbb}
.ps ul{list-style:none}
.ps li{padding-left:10px;position:relative}
.ps li::before{content:"";position:absolute;left:0;top:10px;width:3px;height:3px;border-radius:50%;background:#555}
.rp{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.rp span{padding:3px 8px;border-radius:6px;font-size:11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);cursor:pointer;transition:all .2s}
.rp span:hover{border-color:#a78bfa;color:#fff}
.fav-btn{background:none;border:1px solid rgba(255,255,255,.12);color:#888;padding:4px 12px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s;margin-left:8px}
.fav-btn:hover{border-color:#fbbf24;color:#fbbf24}
.fav-btn.active{color:#fbbf24;border-color:#fbbf24}
#tooltip{position:fixed;padding:5px 10px;background:rgba(0,0,0,.88);border:1px solid rgba(255,255,255,.12);border-radius:6px;font-size:12px;color:#fff;pointer-events:none;z-index:30;opacity:0;transition:opacity .12s;white-space:nowrap}
#tooltip.show{opacity:1}
#bottom-bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10}
#bottom-bar button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#999;padding:8px 16px;border-radius:10px;font-size:12px;cursor:pointer;transition:all .2s;backdrop-filter:blur(6px)}
#bottom-bar button:hover{background:rgba(167,139,250,.15);border-color:#a78bfa;color:#fff}
#hint{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);color:#444;font-size:12px;transition:opacity 2s;pointer-events:none}
/* Meridian Detail Modal */
#circ-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:50;display:none;align-items:center;justify-content:center}
#circ-overlay.open{display:flex}
#circ-modal{background:#111118;border:1px solid rgba(255,255,255,.08);border-radius:14px;width:90vw;max-width:920px;max-height:85vh;overflow:hidden;display:flex;flex-direction:column}
#circ-header{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.05)}
#circ-header h2{font-size:15px;font-weight:600;flex:1}
.circ-close{background:none;border:none;color:#666;font-size:20px;cursor:pointer}
.circ-close:hover{color:#fff}
#circ-body{display:flex;flex:1;overflow:hidden}
#circ-list{width:180px;overflow-y:auto;border-right:1px solid rgba(255,255,255,.05);padding:8px 0;flex-shrink:0}
#circ-list::-webkit-scrollbar{width:3px}
#circ-list::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
.ci{padding:8px 14px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:8px;transition:background .15s;color:#999}
.ci:hover{background:rgba(255,255,255,.04)}
.ci.active{background:rgba(167,139,250,.1);color:#fff}
.ci .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
#circ-view{flex:1;padding:20px;overflow-y:auto;line-height:1.9;color:#bbb;font-size:13px}
#circ-view::-webkit-scrollbar{width:3px}
#circ-view::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
#circ-view h3{color:#fff;font-size:15px;margin-bottom:10px}
#circ-view h4{color:#a78bfa;font-size:13px;margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.05)}
#circ-view .gj-section{color:#ccc;white-space:pre-wrap;font-size:12px;line-height:1.8;margin-top:4px}
/* Favorites Panel */
#fav-panel{position:fixed;top:0;left:0;width:320px;height:100vh;background:rgba(12,12,20,.96);backdrop-filter:blur(20px);border-right:1px solid rgba(255,255,255,.05);transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:25;overflow-y:auto;padding:20px}
#fav-panel.open{transform:translateX(0)}
#fav-panel::-webkit-scrollbar{width:3px}
#fav-panel::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
#fav-panel h2{font-size:16px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.fav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:background .15s;border-bottom:1px solid rgba(255,255,255,.04)}
.fav-item:hover{background:rgba(167,139,250,.08)}
.fav-item .fav-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.fav-item .fav-name{font-size:13px;font-weight:500;color:#fff;flex:1}
.fav-item .fav-code{font-size:11px;color:#888}
.fav-item .fav-remove{background:none;border:none;color:#555;font-size:16px;cursor:pointer;padding:0 4px}
.fav-item .fav-remove:hover{color:#ff4444}
.fav-empty{color:#555;font-size:13px;text-align:center;padding:40px 0}
/* Extra Points Modal */
#extra-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:50;display:none;align-items:center;justify-content:center}
#extra-overlay.open{display:flex}
#extra-modal{background:#111118;border:1px solid rgba(255,255,255,.08);border-radius:14px;width:90vw;max-width:700px;max-height:85vh;overflow:hidden;display:flex;flex-direction:column}
#extra-modal .em-header{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.05);gap:12px}
#extra-modal .em-header h2{font-size:15px;font-weight:600;flex:1}
#extra-search{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#fff;padding:5px 10px;border-radius:6px;font-size:12px;width:160px;outline:none}
#extra-search:focus{border-color:#a78bfa}
#extra-list{flex:1;overflow-y:auto;padding:8px 18px}
#extra-list::-webkit-scrollbar{width:3px}
#extra-list::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
.extra-item{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.extra-item .ei-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.extra-item .ei-code{color:#a78bfa;font-size:12px;font-weight:600}
.extra-item .ei-name{color:#fff;font-size:14px;font-weight:500}
.extra-item .ei-detail{font-size:12px;color:#999;line-height:1.7}
.extra-item .ei-detail strong{color:#bbb}
/* Exam Mode */
#exam-overlay{position:fixed;inset:0;z-index:45;display:none;pointer-events:none}
#exam-overlay.open{display:block}
#exam-bar{position:fixed;top:0;left:0;right:0;padding:12px 20px;background:linear-gradient(180deg,rgba(8,8,16,.98),rgba(8,8,16,.8));z-index:46;display:flex;align-items:center;gap:16px;pointer-events:auto}
#exam-bar .eq-question{flex:1;font-size:16px;font-weight:600;color:#fff}
#exam-bar .eq-score{font-size:14px;color:#a78bfa;font-weight:600}
#exam-bar .eq-progress{font-size:12px;color:#888}
#exam-bar .eq-exit{background:rgba(255,68,68,.15);border:1px solid rgba(255,68,68,.3);color:#ff6666;padding:5px 14px;border-radius:8px;font-size:12px;cursor:pointer}
#exam-bar .eq-exit:hover{background:rgba(255,68,68,.3)}
#exam-result{position:fixed;inset:0;background:rgba(8,8,16,.95);z-index:47;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:auto}
#exam-result.show{display:flex}
#exam-result .er-score{font-size:64px;font-weight:800;background:linear-gradient(135deg,#a78bfa,#6dd5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#exam-result .er-label{font-size:18px;color:#888;margin-top:8px}
#exam-result .er-btn{margin-top:30px;background:rgba(167,139,250,.2);border:1px solid #a78bfa;color:#fff;padding:10px 30px;border-radius:10px;font-size:14px;cursor:pointer}
#exam-result .er-btn:hover{background:rgba(167,139,250,.4)}
.exam-flash{position:fixed;inset:0;z-index:44;pointer-events:none;opacity:0;transition:opacity .3s}
.exam-flash.green{background:rgba(34,197,94,.15);opacity:1}
.exam-flash.red{background:rgba(239,68,68,.15);opacity:1}
/* Ziwu Liuzhu (Hourly Flow) */
#ziwu-indicator{position:fixed;bottom:20px;left:20px;background:rgba(15,15,22,.9);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px 14px;z-index:10;cursor:pointer;display:flex;align-items:center;gap:8px;backdrop-filter:blur(8px);transition:all .2s}
#ziwu-indicator:hover{border-color:#a78bfa;background:rgba(15,15,22,.95)}
#ziwu-indicator .zi-dot{width:10px;height:10px;border-radius:50%;animation:pulse-zi 2s ease-in-out infinite}
@keyframes pulse-zi{0%,100%{opacity:1}50%{opacity:.4}}
#ziwu-indicator .zi-text{font-size:12px;color:#ccc}
#ziwu-indicator .zi-time{font-size:10px;color:#888}
#ziwu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:50;display:none;align-items:center;justify-content:center}
#ziwu-overlay.open{display:flex}
#ziwu-modal{background:#111118;border:1px solid rgba(255,255,255,.08);border-radius:14px;width:90vw;max-width:560px;max-height:85vh;overflow:hidden;display:flex;flex-direction:column}
#ziwu-modal .zm-header{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.05)}
#ziwu-modal .zm-header h2{font-size:15px;font-weight:600;flex:1}
#ziwu-modal .zm-body{padding:20px;overflow-y:auto}
.ziwu-table{width:100%;border-collapse:collapse}
.ziwu-table td,.ziwu-table th{padding:10px 12px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.05);text-align:left}
.ziwu-table th{color:#888;font-weight:500;font-size:11px}
.ziwu-table tr.active-row{background:rgba(167,139,250,.1)}
.ziwu-table .zt-time{color:#888;font-size:12px;white-space:nowrap}
.ziwu-table .zt-name{color:#fff;font-weight:500}
.ziwu-table .zt-organ{color:#bbb}
.ziwu-table .zt-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
@media(max-width:700px){
  #panel{width:100%}
  #fav-panel{width:100%}
  #mtabs{left:16px;top:86px;max-width:calc(100vw - 32px)}
  #search-box{top:56px}
  #circ-list{width:120px}
  .mt-info-banner{left:16px;top:120px}
  #ziwu-indicator{bottom:70px}
}
</style>
</head>

<div id="loading"><div class="ring"></div><p>加载中...</p><div class="progress-bar"><div class="progress-fill" id="load-progress"></div></div></div>

function getFavs() { try { return JSON.parse(localStorage.getItem('acu_favs') || '[]'); } catch(e) { return []; } }
function setFavs(arr) { localStorage.setItem('acu_favs', JSON.stringify(arr)); }
function isFav(code) { return getFavs().includes(code); }
function toggleFav(code) {
  let favs = getFavs();
  if (favs.includes(code)) favs = favs.filter(c => c !== code);
  else favs.push(code);
  setFavs(favs);
  return favs.includes(code);
}

// ===== DATA LOADING =====
async function loadAllData() {
  let loaded = 0;
  const total = 4;
  const update = () => { loaded++; loadProgress.style.width = (loaded/total*40)+'%'; };

  try {
    const [pRes, mRes, eRes, exRes] = await Promise.all([
      fetch('data/points.json').then(r => r.json()),
      fetch('data/meridians.json').then(r => r.json()),
      fetch('data/extra.json').then(r => r.json()),
      fetch('data/exam.json').then(r => r.json())
    ]);
    pointsData = pRes; update();
    meridiansData = mRes; update();
    extraData = eRes; update();
    examData = exRes; update();
  } catch(e) {
    console.warn('Data files load error, using inline DB_RAW:', e);
  }

  // Build DB lookup: merge loaded points with inline DB_RAW
  const DB = {};
  DB_RAW.forEach(d => { if(d.c) DB[d.c] = d; });
  // Overlay loaded data (has qx, gj fields)
  pointsData.forEach(d => {
    if(d.c) {
      if (!DB[d.c]) DB[d.c] = d;
      else { DB[d.c].qx = d.qx; DB[d.c].gj = d.gj; }
    }
  });

  // Build POINTS array
  const POINTS = [];
  Object.entries(POS).forEach(([key, arr]) => {
    const code = key;
    const mCode = key.replace(/\d+/g,'');
    const side = arr[0];
    const x = arr[1], y = arr[2], z = arr[3];
    const db = DB[code] || {};
    POINTS.push({
      id: code, m: mCode, side,
      name: db.n || code, loc: db.l || '', func: db.f || '', needle: db.k || '', traits: db.t || '',
      qx: db.qx || '', gj: db.gj || '',
      x, y, z
    });
    if (side !== 0) {
      POINTS.push({
        id: code + '_R', m: mCode, side: -side,
        name: db.n || code, loc: db.l || '', func: db.f || '', needle: db.k || '', traits: db.t || '',
        qx: db.qx || '', gj: db.gj || '',
        x: -x, y, z, mirrored: true
      });
    }
  });

  return { POINTS, DB };
}

// ===== LOAD BODY MODEL =====
function buildBody() {
  const loader = new OBJLoader();
  loader.load('model/body.obj', (obj) => {
    const skinMat = new THREE.MeshPhysicalMaterial({
      color: 0xd4a574,
      roughness: 0.55,
      metalness: 0.02,
      clearcoat: 0.15,
      clearcoatRoughness: 0.4,
      sheen: 0.3,
      sheenRoughness: 0.6,
      sheenColor: 0xffccaa,
      side: THREE.DoubleSide
    });
    obj.traverse(ch => {
      if (ch.isMesh) {
        ch.geometry.computeVertexNormals();
        ch.material = skinMat;
      }
    });
    obj.scale.set(95.3, 95.3, 95.3);
    obj.position.y = -11.2;
    bodyMesh = obj;
    scene.add(obj);
    loading.classList.add('hide');
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      const pct = Math.round(xhr.loaded / xhr.total * 100);
      loading.querySelector('p').textContent = `加载模型 ${pct}%`;
      loadProgress.style.width = (40 + pct * 0.6) + '%';
    }
  },
  () => {
    const geo = new THREE.CapsuleGeometry(6, 80, 16, 32);
    const mat = new THREE.MeshPhongMaterial({color:0xd4b896, transparent:true, opacity:0.85});
    const body = new THREE.Mesh(geo, mat);
    body.position.y = -10;
    bodyMesh = body;
    scene.add(body);
    loading.classList.add('hide');
  });
}

// ===== ACUPOINTS =====
function createPoints() {
  const geo = new THREE.SphereGeometry(0.55, 12, 12);

  POINTS.forEach(pt => {
    const mInfo = M[pt.m];
    if (!mInfo) return;
    const mat = new THREE.MeshStandardMaterial({
      color: mInfo.color, emissive: mInfo.color, emissiveIntensity: 0.3,
      roughness: 0.3, metalness: 0.5
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(pt.x, pt.y, pt.z);
    mesh.userData = pt;
    scene.add(mesh);
    pointMeshes.push(mesh);
  });

  // Meridian lines + flow trails
  Object.keys(M).forEach(mKey => {
    const mPts = POINTS.filter(p => p.m === mKey && !p.mirrored)
      .sort((a,b) => parseInt(a.id.replace(/\D/g,'')) - parseInt(b.id.replace(/\D/g,'')));
    if (mPts.length < 2) return;
    const vecs = mPts.map(p => new THREE.Vector3(p.x, p.y, p.z));
    if (vecs.length >= 3) {
      const curve = new THREE.CatmullRomCurve3(vecs, false);
      const smoothPts = curve.getPoints(mPts.length * 4);
      const lg = new THREE.BufferGeometry().setFromPoints(smoothPts);
      const lm = new THREE.LineBasicMaterial({color:M[mKey].color, transparent:true, opacity:0.2});
      const line = new THREE.Line(lg, lm);
      line.userData = {meridian: mKey};
      scene.add(line);
      lineMeshes.push(line);
      createFlowTrail(curve, mKey);
    }

    const mPtsR = POINTS.filter(p => p.m === mKey && p.mirrored)
      .sort((a,b) => parseInt(a.id.replace(/\D/g,'')) - parseInt(b.id.replace(/\D/g,'')));
    if (mPtsR.length >= 3) {
      const vecsR = mPtsR.map(p => new THREE.Vector3(p.x, p.y, p.z));
      const curve = new THREE.CatmullRomCurve3(vecsR, false);
      const smoothPts = curve.getPoints(mPtsR.length * 4);
      const lg = new THREE.BufferGeometry().setFromPoints(smoothPts);
      const lm = new THREE.LineBasicMaterial({color:M[mKey].color, transparent:true, opacity:0.15});
      const line = new THREE.Line(lg, lm);
      line.userData = {meridian: mKey};
      scene.add(line);
      lineMeshes.push(line);
      createFlowTrail(curve, mKey);
    }
  });
}

function createFlowTrail(curve, mKey) {
  const cometCount = 2;
  const tailLen = 10;
  const color = M[mKey].color;
  const comets = [];
  for (let c = 0; c < cometCount; c++) {
    const trail = [];
    for (let i = 0; i <= tailLen; i++) {
      const ratio = 1 - i / tailLen;
      const r = i === 0 ? 0.7 : 0.55 * ratio;
      const geo = new THREE.SphereGeometry(r, 8, 8);
      const mat = new THREE.MeshStandardMaterial({
        color, emissive: color,
        emissiveIntensity: i === 0 ? 3.0 : 2.0 * ratio,
        transparent: true,
        opacity: i === 0 ? 1.0 : 0.75 * ratio,
        depthWrite: false
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.visible = false;
      mesh.renderOrder = 1;
      scene.add(mesh);
      trail.push(mesh);
    }
    comets.push(trail);
  }
  // Also create a glowing tube along the full curve (dim, as base path)
  const tube = new THREE.TubeGeometry(curve, 80, 0.18, 6, false);
  const tubeMat = new THREE.MeshStandardMaterial({
    color, emissive: color, emissiveIntensity: 0.6,
    transparent: true, opacity: 0.0, depthWrite: false
  });
  const tubeMesh = new THREE.Mesh(tube, tubeMat);
  tubeMesh.visible = false;
  tubeMesh.userData = {meridian: mKey};
  scene.add(tubeMesh);

  flowParticles.push({comets, curve, mKey, tube: tubeMesh});
}

// ===== UI: TABS =====
function buildTabs() {
  const cont = document.getElementById('mtabs');
  let html = '<div class="mt active" data-m="all" style="--mc:#a78bfa">全部</div>';
  Object.entries(M).forEach(([k,v]) => {
    html += `<div class="mt" data-m="${k}" style="--mc:${v.css}">${v.name}</div>`;
  });
  cont.innerHTML = html;
  cont.querySelectorAll('.mt').forEach(t => {

      cont.querySelectorAll('.mt').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      currentFilter = t.dataset.m;
      filterMeridian(currentFilter);
      showMeridianBanner(currentFilter);
    });
  });
}

function showMeridianBanner(mKey) {
  const banner = document.getElementById('mt-info-banner');
  if (mKey === 'all') { banner.classList.remove('show'); return; }
  const mInfo = M[mKey];
  if (!mInfo) { banner.classList.remove('show'); return; }
  const count = POINTS.filter(p => p.m === mKey && !p.mirrored).length;
  banner.innerHTML = `<span class="mib-name" style="color:${mInfo.css}">${mInfo.full}</span><span class="mib-count">${count}穴</span><span class="mib-link" onclick="openCircToMeridian('${mKey}')">详情</span>`;
  banner.classList.add('show');
  clearTimeout(banner._timer);
  banner._timer = setTimeout(() => banner.classList.remove('show'), 5000);
}

function filterMeridian(m) {
  currentFilter = m;
  pointMeshes.forEach(mesh => {
    mesh.visible = m === 'all' || mesh.userData.m === m;
  });
  lineMeshes.forEach(line => {
    line.visible = m === 'all' || line.userData.meridian === m;
  });
  flowParticles.forEach(group => {
    const vis = flowEnabled && (m === 'all' || group.mKey === m);
    group.comets.forEach(trail => trail.forEach(sp => { sp.visible = vis; }));
    group.tube.visible = vis;
    group.tube.material.opacity = vis ? 0.25 : 0;
  });
}

// ===== EVENTS =====
function setupEvents() {
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  renderer.domElement.addEventListener('mousemove', e => {
    mouse.x = (e.clientX/innerWidth)*2-1;
    mouse.y = -(e.clientY/innerHeight)*2+1;
    raycaster.setFromCamera(mouse, camera);
    const visible = pointMeshes.filter(m => m.visible);
    const hits = raycaster.intersectObjects(visible);
    if (hits.length > 0) {
      const mesh = hits[0].object;
      if (hoveredPt !== mesh) {
        if (hoveredPt && hoveredPt !== selectedPt) { hoveredPt.material.emissiveIntensity=.3; hoveredPt.scale.setScalar(1); }
        hoveredPt = mesh;
        hoveredPt.material.emissiveIntensity = .7;
        hoveredPt.scale.setScalar(1.3);
      }
      const pt = mesh.userData;
      tooltip.textContent = `${pt.id} ${pt.name}`;
      tooltip.style.left = e.clientX+14+'px';
      tooltip.style.top = e.clientY-8+'px';
      tooltip.classList.add('show');
      renderer.domElement.style.cursor = 'pointer';
    } else {
      if (hoveredPt && hoveredPt !== selectedPt) { hoveredPt.material.emissiveIntensity=.3; hoveredPt.scale.setScalar(1); }
      hoveredPt = null;
      tooltip.classList.remove('show');
      renderer.domElement.style.cursor = 'grab';
    }
  });

  renderer.domElement.addEventListener('click', () => {
    raycaster.setFromCamera(mouse, camera);
    const visible = pointMeshes.filter(m => m.visible);
    const hits = raycaster.intersectObjects(visible);
    if (hits.length > 0) {
      if (examActive) {
        handleExamClick(hits[0].object);
      } else {
        selectPoint(hits[0].object);
      }
    }
  });

  renderer.domElement.addEventListener('touchstart', e => {
    if (e.touches.length!==1) return;
    const t = e.touches[0];
    mouse.x = (t.clientX/innerWidth)*2-1;
    mouse.y = -(t.clientY/innerHeight)*2+1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(pointMeshes.filter(m=>m.visible));
    if (hits.length > 0) {
      e.preventDefault();
      if (examActive) handleExamClick(hits[0].object);
      else selectPoint(hits[0].object);
    }
  }, {passive:false});

  // Search
  const si = document.getElementById('search-input');
  const sr = document.getElementById('search-results');
  si.addEventListener('input', () => {
    const q = si.value.trim().toLowerCase();
    if (!q) { sr.classList.remove('show'); return; }
    const results = POINTS.filter(p => !p.mirrored && (
      p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q)
    )).slice(0,12);
    if (!results.length) { sr.classList.remove('show'); return; }
    sr.innerHTML = results.map(p => {
      const mc = M[p.m]?.css||'#888';
      return `<div class="sr-item" data-id="${p.id}"><span class="sr-dot" style="background:${mc}"></span><span class="sr-name">${p.name}</span><span class="sr-code">${p.id} · ${M[p.m]?.name||''}</span></div>`;
    }).join('');
    sr.classList.add('show');
    sr.querySelectorAll('.sr-item').forEach(item => {
      item.addEventListener('click', () => {
        const mesh = pointMeshes.find(m => m.userData.id === item.dataset.id);
        if (mesh) selectPoint(mesh);
        sr.classList.remove('show');
        si.value = '';
      });
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#search-box') && !e.target.closest('#search-results'))
      sr.classList.remove('show');
  });

  // Buttons
  document.getElementById('btn-circ').addEventListener('click', openCirc);
  document.getElementById('btn-wire').addEventListener('click', toggleWire);
  document.getElementById('btn-flow').addEventListener('click', toggleFlow);
  document.getElementById('btn-extra').addEventListener('click', openExtra);
  document.getElementById('btn-exam').addEventListener('click', startExam);
  document.getElementById('btn-fav').addEventListener('click', openFav);
  document.getElementById('btn-rot').addEventListener('click', () => {
    autoRotate = !autoRotate;
    document.getElementById('btn-rot').classList.toggle('active', autoRotate);
  });
}

// ===== SELECT POINT =====
function selectPoint(mesh) {
  if (selectedPt) { selectedPt.material.emissiveIntensity=.3; selectedPt.scale.setScalar(1); }
  selectedPt = mesh;
  mesh.material.emissiveIntensity = 1;
  mesh.scale.setScalar(1.5);
  autoRotate = false;
  document.getElementById('btn-rot').classList.remove('active');
  introAnim = false;

  const pt = mesh.userData;
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  const offset = new THREE.Vector3(pt.x > 10 ? 35 : pt.x < -10 ? -35 : 0, 5, pt.z > 0 ? 40 : -40);
  targetPos = new THREE.Vector3(pt.x + offset.x, pt.y + offset.y, pt.z + offset.z);
  targetLook = new THREE.Vector3(pt.x, pt.y, pt.z);
  animating = true;

  showPanel(pt);
}

function showPanel(pt) {
  const mInfo = M[pt.m] || {};
  const funcList = pt.func ? pt.func.split(/[。；]/).filter(s=>s.replace(/[①-⑳]/g,'').trim()).map(s=>s.replace(/^[①-⑳]/,'').trim()) : [];
  const favActive = isFav(pt.id) ? ' active' : '';

  let h = `<div style="margin-bottom:16px">
    <div style="display:flex;align-items:center">
      <div class="pn" style="color:${mInfo.css||'#fff'}">${pt.name}</div>
      <button class="fav-btn${favActive}" onclick="toggleFavBtn('${pt.id}',this)" title="收藏">${isFav(pt.id)?'★':'☆'}</button>
    </div>
    <div class="pp">${pt.id}</div>
    ${pt.traits ? `<div style="font-size:12px;color:#a78bfa;margin-top:4px">${pt.traits}</div>` : ''}
    <span class="pm" style="background:color-mix(in srgb,${mInfo.css||'#888'} 15%,transparent);color:${mInfo.css||'#888'}">${mInfo.full||pt.m}</span>
  </div>`;

  if (pt.gj) h += `<div class="ps"><h3>归经</h3><p>${pt.gj}</p></div>`;
  if (pt.loc) h += `<div class="ps"><h3>定位</h3><p>${pt.loc}</p></div>`;
  if (pt.qx) h += `<div class="ps"><h3>取穴方法</h3><p>${pt.qx}</p></div>`;
  if (funcList.length) h += `<div class="ps"><h3>主治</h3><ul>${funcList.map(f=>`<li>${f}</li>`).join('')}</ul></div>`;
  if (pt.needle) h += `<div class="ps"><h3>刺法</h3><p>${pt.needle}</p></div>`;

  // Related points
  const related = POINTS.filter(p => p.m === pt.m && !p.mirrored && p.id !== pt.id && p.id !== pt.id.replace('_R',''));
  if (related.length) {
    h += `<div class="ps"><h3>同经穴位 (${related.length})</h3><div class="rp">`;
    related.forEach(r => {
      h += `<span data-id="${r.id}">${r.name}</span>`;
    });
    h += '</div></div>';
  }

  document.getElementById('pc').innerHTML = h;
  panel.classList.add('open');

  document.querySelectorAll('.rp span').forEach(s => {
    s.addEventListener('click', () => {
      const mesh = pointMeshes.find(m => m.userData.id === s.dataset.id);
      if (mesh) selectPoint(mesh);
    });
  });
}

window.toggleFavBtn = (code, btn) => {
  const now = toggleFav(code);
  btn.textContent = now ? '★' : '☆';
  btn.classList.toggle('active', now);
};

window.closePanel = () => {
  panel.classList.remove('open');
  if (selectedPt) { selectedPt.material.emissiveIntensity=.3; selectedPt.scale.setScalar(1); selectedPt=null; }
};

window.resetCamera = () => {
  targetPos = new THREE.Vector3(0, 20, 120);
  targetLook = new THREE.Vector3(0, 10, 0);
  animating = true;
  closePanel();
};

function toggleWire() {
  const btn = document.getElementById('btn-wire');
  btn.classList.toggle('active');
  if (!bodyMesh) return;
  bodyMesh.traverse(ch => {
    if (ch.isMesh) {
      ch.material.wireframe = !ch.material.wireframe;
      ch.material.transparent = ch.material.wireframe;
      ch.material.opacity = ch.material.wireframe ? 0.3 : 1.0;
      ch.material.needsUpdate = true;
    }
  });
}

function toggleFlow() {
  flowEnabled = !flowEnabled;
  document.getElementById('btn-flow').classList.toggle('active', flowEnabled);
  const show = (g) => flowEnabled && (currentFilter === 'all' || g.mKey === currentFilter);
  flowParticles.forEach(group => {
    const vis = show(group);
    group.comets.forEach(trail => trail.forEach(m => { m.visible = vis; }));
    group.tube.visible = vis;
    group.tube.material.opacity = vis ? 0.25 : 0;
  });
}

// ===== MERIDIAN DETAIL MODAL =====
function openCirc() {
  const list = document.getElementById('circ-list');
  list.innerHTML = CIRCS.map((c,i) =>
    `<div class="ci${i===0?' active':''}" data-i="${i}" data-id="${c.id}"><span class="dot" style="background:${c.color}"></span>${c.name}</div>`
  ).join('');
  list.querySelectorAll('.ci').forEach(item => {
    item.addEventListener('click', () => {
      list.querySelectorAll('.ci').forEach(x=>x.classList.remove('active'));
      item.classList.add('active');
      showCircItem(+item.dataset.i);
    });
  });
  showCircItem(0);
  document.getElementById('circ-overlay').classList.add('open');
}

function openCircToMeridian(mKey) {
  openCirc();
  const idx = CIRCS.findIndex(c => c.id === mKey);
  if (idx >= 0) {
    const list = document.getElementById('circ-list');
    list.querySelectorAll('.ci').forEach(x=>x.classList.remove('active'));
    const target = list.querySelector(`[data-id="${mKey}"]`);
    if (target) { target.classList.add('active'); target.scrollIntoView({block:'center'}); }
    showCircItem(idx);
  }
}
window.openCircToMeridian = openCircToMeridian;

function showCircItem(i) {
  const c = CIRCS[i];
  const view = document.getElementById('circ-view');
  const mData = meridiansData[c.id];

  let html = `<h3 style="color:${c.color}">${c.name}</h3>`;
  html += `<p>${c.desc}</p>`;

  if (mData) {
    if (mData.zz) {
      html += `<h4>主治概要</h4><p>${mData.zz.replace(/\n/g,'<br>')}</p>`;
    }
    if (mData.gj) {
      html += `<h4>歌诀</h4>`;
      let gj = mData.gj;
      // Format sections with 【】
      gj = gj.replace(/【([^】]+)】/g, '</div><div class="gj-section"><strong style="color:#a78bfa">【$1】</strong><br>');
      if (gj.startsWith('</div>')) gj = gj.substring(6);
      gj += '</div>';
      html += gj;
    }
  } else {
    // For extra vessels (chongmai, daimai, etc.) - no meridian data
    // Already showed desc above
  }

  view.innerHTML = html;
}

window.closeCirc = () => document.getElementById('circ-overlay').classList.remove('open');
document.getElementById('circ-overlay').addEventListener('click', e => { if(e.target.id==='circ-overlay') closeCirc(); });

// ===== EXTRA POINTS MODAL =====
function openExtra() {
  renderExtraList('');
  document.getElementById('extra-overlay').classList.add('open');
  const searchEl = document.getElementById('extra-search');
  searchEl.value = '';
  searchEl.oninput = () => renderExtraList(searchEl.value.trim().toLowerCase());
}

function renderExtraList(query) {
  const list = document.getElementById('extra-list');
  let filtered = extraData;
  if (query) {
    filtered = extraData.filter(e =>
      (e.n && e.n.includes(query)) || (e.c && e.c.toLowerCase().includes(query)) ||
      (e.dw && e.dw.includes(query)) || (e.zz && e.zz.includes(query))
    );
  }
  if (!filtered.length) {
    list.innerHTML = '<div style="color:#555;text-align:center;padding:40px">未找到匹配的奇穴</div>';
    return;
  }
  list.innerHTML = filtered.map(e => `
    <div class="extra-item">
      <div class="ei-top"><span class="ei-code">${e.c||''}</span><span class="ei-name">${e.n||''}</span></div>
      <div class="ei-detail">
        ${e.dw ? `<div><strong>定位：</strong>${e.dw}</div>` : ''}
        ${e.zz ? `<div><strong>主治：</strong>${e.zz}</div>` : ''}
        ${e.cz ? `<div><strong>操作：</strong>${e.cz}</div>` : ''}
        ${e.tx ? `<div><strong>特性：</strong>${e.tx}</div>` : ''}
      </div>
    </div>
  `).join('');
}

window.closeExtra = () => document.getElementById('extra-overlay').classList.remove('open');
document.getElementById('extra-overlay').addEventListener('click', e => { if(e.target.id==='extra-overlay') closeExtra(); });

// ===== FAVORITES PANEL =====
function openFav() {
  renderFavList();
  document.getElementById('fav-panel').classList.add('open');
}

function renderFavList() {
  const list = document.getElementById('fav-list');
  const favs = getFavs();
  if (!favs.length) {
    list.innerHTML = '<div class="fav-empty">暂无收藏穴位<br>点击穴位详情中的 ☆ 添加收藏</div>';
    return;
  }
  list.innerHTML = favs.map(code => {
    const pt = POINTS.find(p => p.id === code);
    if (!pt) return '';
    const mc = M[pt.m]?.css || '#888';
    return `<div class="fav-item" data-id="${code}">
      <span class="fav-dot" style="background:${mc}"></span>
      <span class="fav-name">${pt.name}</span>
      <span class="fav-code">${code}</span>
      <button class="fav-remove" onclick="event.stopPropagation();removeFavItem('${code}')">&times;</button>
    </div>`;
  }).join('');

  list.querySelectorAll('.fav-item').forEach(item => {
    item.addEventListener('click', () => {
      const mesh = pointMeshes.find(m => m.userData.id === item.dataset.id);
      if (mesh) { selectPoint(mesh); closeFav(); }
    });
  });
}

window.removeFavItem = (code) => {
  let favs = getFavs().filter(c => c !== code);
  setFavs(favs);
  renderFavList();
};

window.closeFav = () => document.getElementById('fav-panel').classList.remove('open');

// ===== ZIWU LIUZHU =====
function getActiveZiwu() {
  const h = new Date().getHours();
  return ZIWU.find(z => {
    if (z.start < z.end) return h >= z.start && h < z.end;
    return h >= z.start || h < z.end; // crosses midnight (23-1)
  }) || ZIWU[0];
}

function initZiwu() {
  updateZiwuIndicator();
  setInterval(updateZiwuIndicator, 60000);

  document.getElementById('ziwu-indicator').addEventListener('click', openZiwu);
}

function updateZiwuIndicator() {
  const active = getActiveZiwu();
  const mc = M[active.code]?.css || '#a78bfa';
  const el = document.getElementById('ziwu-indicator');
  el.querySelector('.zi-dot').style.background = mc;
  el.querySelector('.zi-text').textContent = `${active.organ}经当令`;
  el.querySelector('.zi-time').textContent = `${active.dizhi} (${active.start}:00-${active.end}:00)`;
}

function openZiwu() {
  const active = getActiveZiwu();
  const body = document.getElementById('ziwu-body');
  let html = '<table class="ziwu-table"><thead><tr><th>时辰</th><th>时间</th><th>经络</th><th>脏腑</th></tr></thead><tbody>';
  ZIWU.forEach(z => {
    const mc = M[z.code]?.css || '#888';
    const isActive = z.code === active.code;
    const endStr = z.end < 10 ? '0'+z.end : z.end;
    const startStr = z.start < 10 ? '0'+z.start : z.start;
    html += `<tr class="${isActive?'active-row':''}">
      <td class="zt-time">${z.dizhi}</td>
      <td class="zt-time">${startStr}:00-${endStr}:00</td>
      <td class="zt-name"><span class="zt-dot" style="background:${mc}"></span>${M[z.code]?.full||z.name}</td>
      <td class="zt-organ">${z.organ}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  body.innerHTML = html;
  document.getElementById('ziwu-overlay').classList.add('open');
}

window.closeZiwu = () => document.getElementById('ziwu-overlay').classList.remove('open');
document.getElementById('ziwu-overlay').addEventListener('click', e => { if(e.target.id==='ziwu-overlay') closeZiwu(); });

// ===== EXAM MODE =====
function startExam() {
  if (!examData.length) { alert('考试数据加载失败'); return; }
  // Pick 10 random questions
  const shuffled = [...examData].sort(() => Math.random() - 0.5);
  examQuestions = shuffled.slice(0, 10);
  examIndex = 0;
  examScore = 0;
  examActive = true;

  // Reset all point visibility
  currentFilter = 'all';
  filterMeridian('all');
  document.querySelectorAll('.mt').forEach(t => t.classList.remove('active'));
  document.querySelector('.mt[data-m="all"]')?.classList.add('active');

  document.getElementById('exam-overlay').classList.add('open');
  document.getElementById('exam-result').classList.remove('show');
  closePanel();
  closeFav();

  showExamQuestion();
}

function showExamQuestion() {
  if (examIndex >= examQuestions.length) {
    endExam();
    return;
  }
  const q = examQuestions[examIndex];
  // Extract point name from title like "请定位穴位(中府)"
  const nameMatch = q.t.match(/[（(]([^）)]+)[）)]/);
  const pointName = nameMatch ? nameMatch[1] : q.t;

  const bar = document.getElementById('exam-bar');
  bar.querySelector('.eq-question').textContent = `请点击穴位：${pointName}`;
  bar.querySelector('.eq-score').textContent = `得分: ${examScore}`;
  bar.querySelector('.eq-progress').textContent = `${examIndex + 1}/10`;
}

function handleExamClick(mesh) {
  if (!examActive) return;
  const q = examQuestions[examIndex];
  const clickedCode = mesh.userData.id.replace('_R', '');
  const flash = document.getElementById('exam-flash');

  if (clickedCode === q.a) {
    // Correct
    examScore += 10;
    flash.className = 'exam-flash green';
    setTimeout(() => flash.className = 'exam-flash', 400);
    examIndex++;
    setTimeout(showExamQuestion, 500);
  } else {
    // Wrong - highlight correct answer
    flash.className = 'exam-flash red';
    setTimeout(() => flash.className = 'exam-flash', 400);

    // Highlight correct point
    const correctMesh = pointMeshes.find(m => m.userData.id === q.a);
    if (correctMesh) {
      correctMesh.material.emissiveIntensity = 1;
      correctMesh.scale.setScalar(2);
      setTimeout(() => {
        correctMesh.material.emissiveIntensity = 0.3;
        correctMesh.scale.setScalar(1);
      }, 1500);
    }
    examIndex++;
    setTimeout(showExamQuestion, 1600);
  }
}

function endExam() {
  examActive = false;
  document.getElementById('exam-overlay').classList.remove('open');
  const result = document.getElementById('exam-result');
  result.querySelector('.er-score').textContent = `${examScore}/100`;
  result.classList.add('show');
}

window.exitExam = () => {
  examActive = false;
  document.getElementById('exam-overlay').classList.remove('open');
  document.getElementById('exam-result').classList.remove('show');
};

// ===== ANIMATION LOOP =====
function animate() {
  requestAnimationFrame(animate);

  if (introAnim) {
    const t = clock.getElapsedTime();
    if (t < 3) {
      const p = t / 3;
      camera.position.set(
        120 * Math.sin(p * Math.PI * 0.5),
        40 - p * 20,
        200 - p * 80
      );
      controls.target.set(0, 10, 0);
    } else {
      introAnim = false;
    }
  }

  if (animating && targetPos) {
    camera.position.lerp(targetPos, 0.06);
    controls.target.lerp(targetLook, 0.06);
    if (camera.position.distanceTo(targetPos) < 0.3) animating = false;
  }

  controls.autoRotate = autoRotate && !animating && !introAnim;

  if (selectedPt) {
    selectedPt.scale.setScalar(1.3 + Math.sin(clock.getElapsedTime()*4)*.2);
  }

  // Flow comet-trail animation
  if (flowEnabled) {
    const t = clock.getElapsedTime();
    flowParticles.forEach(group => {
      if (!group.comets[0][0].visible) return;
      const cometCount = group.comets.length;
      const tailLen = group.comets[0].length - 1;
      const speed = 0.06;
      const spacing = 0.012;
      for (let c = 0; c < cometCount; c++) {
        const trail = group.comets[c];
        const headT = ((t * speed + c / cometCount) % 1);
        for (let i = 0; i <= tailLen; i++) {
          const segT = headT - i * spacing;
          const clampedT = ((segT % 1) + 1) % 1;
          const pt = group.curve.getPointAt(clampedT);
          trail[i].position.copy(pt);
          if (i === 0) {
            const pulse = 1.0 + Math.sin(t * 5 + c * 3) * 0.15;
            trail[i].scale.setScalar(pulse);
            trail[i].material.emissiveIntensity = 2.5 + Math.sin(t * 8 + c) * 0.5;
          }
        }
      }
      // Pulse the tube glow subtly
      group.tube.material.emissiveIntensity = 0.4 + Math.sin(t * 2) * 0.2;
    });
  }

  controls.update();
  renderer.render(scene, camera);
}
